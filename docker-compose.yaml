services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      # 9001 仅供内部 nginx 反代，不对外暴露
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  backend:
    image: crpi-wjscuxkxm163odo3.cn-hangzhou.personal.cr.aliyuncs.com/dkl091219/mqtt-mgr-backend:v1.9.1
    container_name: mqtt-mgr-backend
    restart: unless-stopped
    volumes:
      # 配置文件
      - ./backend/config.yaml:/app/config.yaml
      # 宿主机 passwd/acl 挂载进容器，供后端读写
      - ./mosquitto/config/passwd:/data/passwd
      - ./mosquitto/config/acl:/data/acl
      # 控制台设备显示名称，独立于 ACL 和 Mosquitto 数据持久化
      - ./backend/data:/data/metadata
      # 功耗统计数据（本地卷，勿放 SMB/网络盘，SQLite 会锁失败）
      - mqtt_power_data:/data/power
      # Docker socket，用于 docker exec mosquitto_passwd
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mosquitto

  nginx:
    image: crpi-wjscuxkxm163odo3.cn-hangzhou.personal.cr.aliyuncs.com/dkl091219/mqtt-mgr-nginx:v1.9.1
    container_name: mqtt-mgr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - mosquitto

volumes:
  mqtt_power_data:
