# Mosquitto 容器配置
container_name: "mqtt-broker"
container_passwd_path: "/mosquitto/config/passwd"  # 容器内passwd文件路径
host_passwd_path: "/data/passwd"                   # 容器外passwd文件路径（Docker挂载路径）
acl_path: "/data/acl"                              # ACL文件路径（Docker挂载路径）
device_metadata_path: "/data/metadata/device_metadata.json" # 控制台设备显示名称持久化文件
device_config_path: "/data/metadata/device_config.json"     # 插口名/备注/定时任务配置持久化文件
power_db_path: "/data/power/power_stats.db"                # 功耗统计数据 SQLite 文件（本地卷，勿放 SMB）
power_collect_enabled: true                                 # 是否启用功耗采集
power_mqtt_broker: "tcp://mosquitto:1883"                  # 功耗采集连接的 broker（容器网络内地址，未配置时默认此值）

# ACL模式列表, %s 会被替换为用户的MAC地址(大写和小写各一份)
acl_patterns:
  - "device/ztc1/%s/#"
  - "homeassistant/+/%s/#"

# Web管理配置
admin_username: "admin"
admin_password: "admin123"

# 两步验证（TOTP）密钥，base32 格式；留空 = 未开启
# 开启方式: 管理员入口 → 配置 → 两步验证 → 启用并扫码绑定
# 手机丢失时: 清空此字段并重启容器即可解除
# totp_secret: ""

# 注册等级:
#   0 = 禁止注册
#   1 = 任意注册
#   2 = 仅邮箱注册（需邮箱验证码激活）
register_level: 1

# 访客页面开关（MQTT 用户控制台）:
#   true  = 允许普通 MQTT 用户使用控制台
#   false = 关闭访客入口，未登录管理员一律进入管理员登录页，
#           同时封禁 /api/mqtt/login 和注册类接口
# 未配置时默认 true，兼容旧配置文件
guest_page_enabled: true

# 联系维护者信息（显示在注册页）
contact_info: "如需帮助请联系管理员"

# MQTT服务器地址（可选，优先从环境变量读取）
# MQTT_URI: 设备连接地址，如 mqtt.example.com:1883
# MQTT_WS_URI: 前端WebSocket连接地址，如 wss://mqtt.example.com/mqtt
mqtt_uri: ""
mqtt_ws_uri: ""

# SMTP 邮件配置（register_level=2 时必填）
smtp:
  host: "smtp.qiye.aliyun.com"
  port: 465
  username: "example@fjrcn.cn"
  password: "test"
  from: "example@fjrcn.cn"
  tls: true   # true=SSL/TLS(465), false=STARTTLS(587)

# Webhook：插口状态翻转时 POST 到外部机器人（空 URL / enabled=false 则不推）
# 模板变量: ${event} ${mac} ${mac_upper} ${plug} ${prev} ${cur} ${action} ${time} ${count} ${message} ${flips}
# 防刷屏: webhook_throttle_seconds 窗口内多次翻转合并为一条(event=plug_flip_batch)；0=不合并
# webhook_enabled: false
# webhook_url: ""
# webhook_headers: |
#   Authorization: Bearer xxx
# webhook_body: '{"event":"${event}","mac":"${mac}","plug":${plug},"action":"${action}","time":"${time}","count":${count},"message":"${message}"}'
# webhook_retry: 1
# webhook_throttle_seconds: 2

# V2 定时任务错过补发窗口（分钟）
# 后端在"应执行那一分钟"不活着（容器重启 / NAS 休眠 / MQTT 发送失败）时，
# 之后窗口内的 tick 会补发该任务，日志标 "已补发"。0 = 关闭补发（只认当前分钟，与 v2.1.0 行为一致）；上限 120。
# 未配置时默认 30；实际生效值打印在容器启动日志 "[scheduler] ... 补发窗口="
scheduler_catchup_minutes: 30

# V1 固件周期校时（小时）
# v1 排插不联网、不跑 NTP，时间只能由控制台推送 setting.time。前端只在"打开控制台 /
# 设备重连 / 手点同步按钮 / 存倒计时"时推一次，页面长期不开时钟就自由漂移
# （普通晶振 ±20~50ppm ≈ 1~2 分钟/月），定时任务会越来越晚/越来越早。
# 这里由后端兜底：每 N 小时向所有 firmware!=v2 的设备推一次当前时间（只写 setting.time，
# 不动插口开关；v2 设备的任务由后端调度器按服务器时间执行，不需要校时）。
# 未配置时默认 6；0 = 关闭（回到纯前端推送）；上限 168。
# 排查: 启动日志 "[timesync] ..." 与 GET /api/admin/diagnostics/time-sync
v1_time_sync_interval_hours: 6

# V1 后端调度（按任务粒度：任务里带 "exec":"server" 的才由后端执行）
# 背景: v1 排插的定时任务由设备自己按它的时钟执行，而那个时钟无法从外部校准
#       （setting.time 在原厂固件里没有解析分支，见 docs/固件与定时任务链路.md）。
# 打开后: 带 exec="server" 的 v1 任务由后端按【服务器时间】执行，并自动停用设备侧副本(on:0)；
#        其余任务（缺省/"exec":"device"）仍由排插自己执行，后端既不调度也不改动
#        —— 安卓 App 里建的任务因此在两种模式下都不受影响。
# 关闭(默认): 所有 v1 任务都维持设备执行（exec 字段被忽略）。
# 回滚: 改成 false 即可。
v1_backend_scheduling: false

# 服务配置
listen_addr: ":8080"
