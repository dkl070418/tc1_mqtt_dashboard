# 敏感接口限速区（每 IP）：管理员登录/MQTT登录/注册类接口防爆破
# 10m 共享内存约可跟踪 16 万个 IP
limit_req_zone $binary_remote_addr zone=sensitive_api:10m rate=1r/s;

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # 命中限速统一返回 429 + JSON，前端可直接展示 error 字段
    limit_req_status 429;
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"error":"请求过于频繁，请稍后再试"}';
    }

    # ---- 敏感接口：1 次/秒，突发最多 6 次 ----
    # 管理员登录
    location = /api/admin/login {
        limit_req zone=sensitive_api burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MQTT 用户登录（前端控制台连接前校验）
    location = /api/mqtt/login {
        limit_req zone=sensitive_api burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 注册类接口（含邮箱验证码发送，防刷邮件）
    location = /api/register {
        limit_req zone=sensitive_api burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/register/verify {
        limit_req zone=sensitive_api burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/register/add-mac {
        limit_req zone=sensitive_api burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 其余 API 反代
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MQTT WebSocket 反代
    location /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control no-cache;
        proxy_ssl_server_name off;
        proxy_ssl_name $proxy_host;
    }

    # SPA fallback (Vue Router history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
