name: Build and Push to Aliyun

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REGISTRY: crpi-wjscuxkxm163odo3.cn-hangzhou.personal.cr.aliyuncs.com
      HAS_ALIYUN: ${{ secrets.ALIYUN_USERNAME != '' && secrets.ALIYUN_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag from git tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building tag: ${TAG}"
          if [ "${HAS_ALIYUN}" != "true" ]; then
            echo "::error::Missing ALIYUN_USERNAME / ALIYUN_PASSWORD repository secrets"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        if: env.HAS_ALIYUN == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build & push backend (amd64+arm64)
        if: env.HAS_ALIYUN == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 阿里云个人版不认 OCI attestation，必须关闭
          provenance: false
          sbom: false
          build-args: |
            GOPROXY=https://goproxy.cn,direct
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.ALIYUN_USERNAME }}/mqtt-mgr-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push nginx/frontend (amd64+arm64)
        if: env.HAS_ALIYUN == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            NPM_REGISTRY=https://registry.npmmirror.com
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.ALIYUN_USERNAME }}/mqtt-mgr-nginx:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: env.HAS_ALIYUN == 'true'
        run: |
          echo "### Pushed multi-arch images" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ secrets.ALIYUN_USERNAME }}/mqtt-mgr-backend:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ secrets.ALIYUN_USERNAME }}/mqtt-mgr-nginx:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- platforms: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
